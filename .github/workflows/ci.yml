name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.changeset/**'
      - '.vscode/**'
      - '**/.github/**/*.md'
  pull_request:
    paths-ignore:
      - '.changeset/**'
      - '.vscode/**'
      - '**/.github/**/*.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js and dependencies
        uses: ./.github/workflows/setup-node
      - name: Run Oxlint & Oxfmt check
        run: pnpm lint

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js and dependencies
        uses: ./.github/workflows/setup-node
      - name: Cache package builds
        id: dist-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/*/dist
          key: dist-${{ hashFiles('packages/*/src/**', 'pnpm-lock.yaml', 'packages/*/tsdown.config.ts', 'packages/*/tsconfig.json', 'tsconfig.base.json') }}
      - name: Build packages
        if: steps.dist-cache.outputs.cache-hit != 'true'
        run: pnpm build
      - parallel:
          - name: Typecheck
            run: pnpm typecheck
          - name: Validate publishable packages
            run: pnpm check:publish

  test:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        # Release lines the DEV toolchain supports; the published engines.node floor is
        # defended by the `floor-smoke` job. setup-node disables pnpm's devEngines shim,
        # so scripts run under the matrix Node rather than the pinned one.
        node-version: ['24', '26']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js and dependencies
        uses: ./.github/workflows/setup-node
        with:
          runtime: node@${{ matrix.node-version }}
      - name: Restore package builds
        id: dist-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/*/dist
          key: dist-${{ hashFiles('packages/*/src/**', 'pnpm-lock.yaml', 'packages/*/tsdown.config.ts', 'packages/*/tsconfig.json', 'tsconfig.base.json') }}
      - name: Build packages
        if: steps.dist-cache.outputs.cache-hit != 'true'
        run: pnpm build
      - name: Run tests
        run: pnpm test
      - name: Run the floor smoke on the matrix Node
        run: node scripts/floor-smoke.js
      - name: Run the CLI gate-flag E2E
        run: pnpm e2e

  floor-smoke:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The only job pinned to the published engines.node floor: it runs the built
      # dist under a bare `node`, so no dev dependency is held to the end-user's
      # Node — only the build toolchain, which `pnpm build` still runs on it.
      - name: Setup Node.js and dependencies
        uses: ./.github/workflows/setup-node
        with:
          runtime: node@24.16.0
      - name: Restore package builds
        id: dist-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/*/dist
          key: dist-${{ hashFiles('packages/*/src/**', 'pnpm-lock.yaml', 'packages/*/tsdown.config.ts', 'packages/*/tsconfig.json', 'tsconfig.base.json') }}
      # Fallback only: `needs: check` populates this exact cache key, so a miss means
      # eviction. Building here would run tsdown on the floor Node.
      - name: Build packages
        if: steps.dist-cache.outputs.cache-hit != 'true'
        run: pnpm build
      - name: Run the end-user floor smoke
        run: node scripts/floor-smoke.js

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js and dependencies
        uses: ./.github/workflows/setup-node
      - name: Check docs
        run: pnpm --filter docs check
      # Fails when an English page changed without its Japanese counterpart's
      # ledger stamp (AGENTS.md "en/ja docs stay in sync"). After updating both
      # languages by hand, run `pnpm --filter docs run translate:stamp <en-file>`.
      - name: Check en/ja translation drift
        run: pnpm --filter docs run translate:check
      - name: Build docs
        run: pnpm --filter docs build

name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.changeset/**'
      - '.vscode/**'
      - '**/.github/**/*.md'
  pull_request:
    paths-ignore:
      - '.changeset/**'
      - '.vscode/**'
      - '**/.github/**/*.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup Node.js and dependencies
        uses: ./.github/workflows/setup-node
      - name: Run Oxlint & Oxfmt check
        run: pnpm lint

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup Node.js and dependencies
        uses: ./.github/workflows/setup-node
      - name: Cache package builds
        id: dist-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/*/dist
          key: dist-${{ hashFiles('packages/*/src/**', 'pnpm-lock.yaml', 'packages/*/tsup.config.ts') }}
      # This key doesn't vary with the commit SHA, even though `pnpm build`'s prebuild
      # step (scripts/gen-action-pin.mjs) embeds `git rev-parse HEAD` into a generated,
      # gitignored source file — so two commits with identical src/**/lockfile/tsup
      # config can share a cache entry despite producing a different action-pin. This is
      # safe today only because nothing downstream reads that stale `dist`'s embedded SHA:
      # `pnpm build` below is unconditional (always fresh, so the "Verify action dist is
      # up to date" and `check:publish` steps never see a cache-restored dist), and the
      # `test` job's own `pnpm test` regenerates action-pin.generated.ts fresh before
      # vitest runs (no test imports from dist/). If either of those stops being true,
      # this key needs `github.sha` (or an equivalent) added.
      - name: Build packages
        run: pnpm build
      - parallel:
          # PR-blocking on a freshly-built packages/action/dist forced every PR touching
          # core/cli (or their dependencies) to carry a "chore(action): rebuild dist" commit,
          # which conflicts constantly across concurrent branches (large generated bundle,
          # near-zero semantic diff overlap). release.yml now self-heals main's dist right
          # before publishing instead, so this only needs to catch main ever drifting —
          # push-to-main only, never a PR gate.
          - name: Verify action dist is up to date
            if: github.event_name == 'push'
            # git status (not diff): a future tsup output change (e.g. a new chunk file)
            # would show up as untracked, which `git diff` alone would silently miss.
            run: |
              if [ -n "$(git status --porcelain -- packages/action/dist)" ]; then
                git status --porcelain -- packages/action/dist
                echo "::error::packages/action/dist is stale. release.yml should self-heal this on its next run."
                exit 1
              fi
          - name: Typecheck
            run: pnpm typecheck
          - name: Validate publishable packages
            run: pnpm check:publish

  test:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        # setup-node rewrites devEngines.runtime.version to this,
        # so pnpm's managed runtime (onFail: download) actually runs scripts under it.
        # 22.13.0 is the declared engines.node floor (the minimum the pinned pnpm@11.9.0
        # can run on; Node 22 is maintenance LTS until 2027-04);
        # 24.16.0 is the current release used for development (devEngines);
        # '26' is the latest of the Current line (active LTS from 2026-10) — early warning.
        node-version: ['22.13.0', '24.16.0', '26']
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Setup Node.js and dependencies
        uses: ./.github/workflows/setup-node
        with:
          node-version: ${{ matrix.node-version }}
      - name: Restore package builds
        id: dist-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/*/dist
          key: dist-${{ hashFiles('packages/*/src/**', 'pnpm-lock.yaml', 'packages/*/tsup.config.ts') }}
      # See the matching comment on the `check` job's cache step: this key doesn't
      # account for scripts/gen-action-pin.mjs's embedded commit SHA, but a stale
      # cache-restored `dist` here is harmless — `pnpm test` below regenerates
      # action-pin.generated.ts fresh for every commit, and no test reads from dist/.
      - name: Build packages
        if: steps.dist-cache.outputs.cache-hit != 'true'
        run: pnpm build
      - name: Run tests
        run: pnpm test

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup Node.js and dependencies
        uses: ./.github/workflows/setup-node
      - parallel:
          - name: Check docs
            run: pnpm --filter docs check
          - name: Build docs
            run: pnpm --filter docs build

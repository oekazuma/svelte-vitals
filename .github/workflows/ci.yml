name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.changeset/**'
      - '.vscode/**'
      - '**/.github/**/*.md'
  pull_request:
    paths-ignore:
      - '.changeset/**'
      - '.vscode/**'
      - '**/.github/**/*.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js and dependencies
        uses: ./.github/workflows/setup-node
      - name: Run Oxlint & Oxfmt check
        run: pnpm lint

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js and dependencies
        uses: ./.github/workflows/setup-node
      - name: Cache package builds
        id: dist-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/*/dist
          key: dist-${{ hashFiles('packages/*/src/**', 'pnpm-lock.yaml', 'packages/*/tsup.config.ts') }}
      - name: Build packages
        run: pnpm build
      - parallel:
          - name: Typecheck
            run: pnpm typecheck
          - name: Validate publishable packages
            run: pnpm check:publish

  test:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        # setup-node rewrites devEngines.runtime.version to this,
        # so pnpm's managed runtime (onFail: download) actually runs scripts under it.
        # 22.13.0 is the declared engines.node floor (the minimum the pinned pnpm@11.9.0
        # can run on; Node 22 is maintenance LTS until 2027-04);
        # 24.16.0 is the current release used for development (devEngines);
        # '26' is the latest of the Current line (active LTS from 2026-10) — early warning.
        node-version: ['22.13.0', '24.16.0', '26']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js and dependencies
        uses: ./.github/workflows/setup-node
        with:
          node-version: ${{ matrix.node-version }}
      - name: Restore package builds
        id: dist-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/*/dist
          key: dist-${{ hashFiles('packages/*/src/**', 'pnpm-lock.yaml', 'packages/*/tsup.config.ts') }}
      - name: Build packages
        if: steps.dist-cache.outputs.cache-hit != 'true'
        run: pnpm build
      - name: Run tests
        run: pnpm test

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js and dependencies
        uses: ./.github/workflows/setup-node
      - parallel:
          - name: Check docs
            run: pnpm --filter docs check
          - name: Build docs
            run: pnpm --filter docs build

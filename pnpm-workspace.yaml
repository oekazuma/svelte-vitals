packages:
  - 'docs/'
  - 'examples/*'
  - 'packages/*'

minimumReleaseAge: 4320

allowBuilds:
  # telemetry-only postinstall; nothing needs it to run
  '@scarf/scarf': false
  esbuild: true
  sharp: true

catalog:
  '@arethetypeswrong/cli': ^0.18.5
  '@clack/prompts': ^1.9.0
  '@changesets/cli': ^3.0.3
  '@markuplint/html-spec': 5.5.0
  '@types/aria-query': ^5.0.4
  aria-query: 5.3.2
  blume: ^2.2.7
  '@sveltejs/adapter-static': ^3.0.11
  '@sveltejs/kit': ^2.70.4
  '@sveltejs/vite-plugin-svelte': ^7.3.1
  '@types/estree': ^1.0.10
  '@types/node': ^24.19.2
  esm-env: ^1.2.2
  '@gunshi/docs': 0.37.3
  '@gunshi/plugin-completion': 0.37.3
  '@gunshi/plugin-i18n': 0.37.3
  '@gunshi/plugin-suggestion': 0.37.3
  gunshi: 0.37.3
  happy-dom: ^21.0.4
  magicast: ^0.5.5
  node-html-parser: ^9.0.7
  oxfmt: ^0.78.0
  oxlint: ^1.93.0
  '@oxlint/plugins': ^1.93.0
  publint: ^0.3.25
  schema-dts: ^2.1.0
  svelte: ^5.57.3
  svelte-check: ^4.7.8
  textlint: ^15.8.0
  textlint-rule-preset-ja-technical-writing: ^12.0.2
  '@textlint-ja/textlint-rule-preset-ai-writing': ^1.7.0
  tsdown: ^0.23.7
  typescript: ^6.0.3
  vite: ^8.3.8
  vitest: ^5.1.0

catalogs:
  # SvelteKit 3, for examples/sveltekit-3 only; the default catalog stays on SvelteKit 2
  kit3:
    '@sveltejs/adapter-static': ^4.0.1
    '@sveltejs/kit': ^3.2.0

overrides:
  # rolldown's wasm32 binding pulls @emnapi/* 2.0 betas, and pnpm then resolves
  # @napi-rs/wasm-runtime's runtime peer to the beta beside a 1.x core, which crashes blume's build
  '@emnapi/core': ^1.11.3
  '@emnapi/runtime': ^1.11.3
